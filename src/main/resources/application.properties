spring.application.name=filazero-api

# Porta do servidor: o Render define a variavel PORT; na sua maquina usa 8080
server.port=${PORT:8080}
# No Render a API fica atras de um proxy HTTPS: usa os cabecalhos X-Forwarded-* para montar os links corretos
server.forward-headers-strategy=framework

# O banco de dados NAO e configurado aqui: a classe ConnectionFactory le as variaveis
# de ambiente DB_URL, DB_USER e DB_PASSWORD (ou o arquivo .env, na maquina local).

# ---------- Documentacao (Swagger UI) ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
